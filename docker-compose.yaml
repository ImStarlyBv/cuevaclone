# Stack para Coolify (Service -> Docker Compose).
# Los valores sensibles llegan por env; Coolify inyecta SERVICE_FQDN_WEB_8000
# cuando se le asigna un dominio al servicio `web`.

services:
  web:
    build:
      context: https://github.com/ImStarlyBv/cuevaclone.git#main
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    environment:
      DATABASE_URL: postgresql://app:${DB_PASS}@db:5432/streaming
      REDIS_URL: redis://redis:6379/0
      SITE_NAME: ${SITE_NAME:-Cuevana}
      SITE_URL: ${SITE_URL:-http://localhost:8000}
      ADS_ENABLED: ${ADS_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    mem_limit: 320m
    restart: unless-stopped

  worker:
    build:
      context: https://github.com/ImStarlyBv/cuevaclone.git#main
      dockerfile: Dockerfile
    command: python -m worker.main
    environment:
      DATABASE_URL: postgresql://app:${DB_PASS}@db:5432/streaming
      REDIS_URL: redis://redis:6379/0
      CRAWL_RPS: ${CRAWL_RPS:-2}
      REFRESH_MARGIN_H: ${REFRESH_MARGIN_H:-6}
      DELTA_MINUTES: ${DELTA_MINUTES:-15}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # El worker no sirve HTTP: el latido es un fichero que los bucles tocan.
      # Si un bucle se cuelga deja de actualizarse y el contenedor se marca
      # unhealthy, que es justo lo que queremos que pase.
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/worker.heartbeat 2>/dev/null || echo 0) )) -lt 300"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: 320m
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: streaming
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d streaming"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    mem_limit: 160m
    restart: unless-stopped

volumes:
  pgdata:
